<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カメラ起動テスト</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f0f4f8; }
  video { width: 90%; max-width: 400px; border: 3px solid #2b6cb0; border-radius: 8px; background: #000; }
  button { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #2b6cb0; color: white; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

  <h2>iPhone カメラ起動テスト</h2>
  <p>下のボタンを押して、カメラの許可を「許可」にしてください。</p>
  
  <button onclick="openCamera()">カメラを起動する</button>
  <br><br>
  <video id="myVideo" autoplay playsinline></video>

<script>
function openCamera() {
  const constraints = {
    audio: false,
    video: { facingMode: "environment" } // 背面カメラを指定
  };

  navigator.mediaDevices.getUserMedia(constraints)
    .then((stream) => {
      const video = document.getElementById('myVideo');
      video.srcObject = stream;
    })
    .catch((err) => {
      alert("カメラの起動に失敗しました: " + err);
    });
}
</script>
</body>
</html>
