
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JAN見積システム (iPhone最適化版)</title>
<script src="https://unpkg.com"></script>
<style>
body { font-family: sans-serif; margin: 10px; background: #f4f6f8; color: #333; line-height: 1.4; font-size: 14px; }
.container { max-width: 500px; margin: 0 auto; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
h1 { text-align: center; color: #111; font-size: 18px; margin: 0 0 12px 0; border-bottom: 2px solid #2b6cb0; padding-bottom: 6px; }
h2 { color: #2d3748; font-size: 14px; margin: 0 0 8px 0; border-left: 4px solid #2b6cb0; padding-left: 6px; font-weight: bold; }
.section { background: #ffffff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 12px; color: #4a5568; }
input[type="text"], input[type="date"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 14px; background-color: #fff; }
.shipping-alert-box { background: #fffaf0; border: 1px solid #feebc8; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 12px; }
.total-display { font-size: 18px; font-weight: bold; color: #2d3748; }
.meter-text { font-size: 14px; font-weight: bold; margin-top: 4px; }
.status-free { color: #38a169; }
.status-need { color: #dd6b20; }
#reader { width: 100%; max-width: 320px; margin: 0 auto 10px auto; border: 1px solid #cbd5e0; border-radius: 4px; background: #000; overflow: hidden; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11px; }
th, td { border: 1px solid #e2e8f0; padding: 6px; text-align: left; }
th { background: #f7fafc; color: #4a5568; }
.btn { display: block; width: 100%; padding: 14px; background: #2b6cb0; color: white; text-align: center; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 6px; font-weight: bold; -webkit-appearance: none; }
.btn-success { display: block; width: 100%; padding: 14px; background: #38a169; color: white; text-align: center; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 12px; font-weight: bold; -webkit-appearance: none; }
.qty-input { width: 40px; padding: 4px; font-size: 12px; border: 1px solid #cbd5e0; border-radius: 4px; text-align: center; }
.info-text { font-size: 11px; color: #718096; margin-top: 2px; }
.checkbox-label { display: flex; align-items: center; font-weight: normal; font-size: 13px; margin-top: 5px; }
.checkbox-label input { margin-right: 6px; width: 16px; height: 16px; }
.form-group { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>JAN見積システム (iPhone対応版)</h1>

  <div class="section">
    <h2>1. 顧客受付</h2>
    <div class="form-group">
      <label for="customerInput">顧客名検索</label>
      <input type="text" id="customerInput" list="customerList" placeholder="「山田」など入力で検索...">
      <datalist id="customerList"></datalist>
      <label class="checkbox-label">
        <input type="checkbox" id="isNewCustomer" onchange="toggleNewCustomer(this.checked)">新規顧客 (後で住所を入力)
      </label>
      <div id="customerStatus" class="info-text"></div>
    </div>
  </div>

  <div class="shipping-alert-box">
    <div class="total-display">卸総額(下代): <span id="totalAmount">0</span> 円 (税別)</div>
    <div id="shippingMeter" class="meter-text status-need">あと 32,000 円 で送料無料</div>
  </div>

  <div class="section">
    <h2>2. バーコードスキャン</h2>
    <div id="reader"></div>
    <button class="btn" onclick="startScanner()">カメラを起動してスキャン</button>
  </div>

  <div class="section">
    <h2>3. 見積明細一覧</h2>
    <table>
      <thead>
        <tr>
          <th>商品名</th>
          <th>価格(下代)</th>
          <th>数量</th>
          <th>小計</th>
        </tr>
      </thead>
      <tbody id="cartTableBody"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>4. 取引条件・お届け先</h2>
    <div class="form-group">
      <label for="paymentMethod">支払い方法</label>
      <select id="paymentMethod">
        <option value="現金">現金</option>
        <option value="代引き">代引き</option>
        <option value="掛け売り">掛け売り</option>
      </select>
    </div>
    <div class="form-group">
      <label for="deliveryDate">希望納期</label>
      <input type="date" id="deliveryDate">
    </div>
    <div class="form-group">
      <label for="shippingAddress">お届け先住所記入欄</label>
      <input type="text" id="shippingAddress" placeholder="マスタと異なる直送先や新規住所">
    </div>
    <button class="btn btn-success" onclick="generatePDF()">見積データ確定</button>
  </div>
</div>

<script>
// --- テスト用マスタデータ ---
const productMaster = {
    "4901234567890": { code: "A-101", name: "特選サンプル商品A", retailPrice: 1200, wholesalePrice: 840, lot: 6 },
    "4901234567891": { code: "B-202", name: "標準サンプル商品B", retailPrice: 800, wholesalePrice: 560, lot: 12 }
};

const customerMaster = [
    { id: "C001", name: "山田商事 株式会社" },
    { id: "C002", name: "鈴木商店" },
    { id: "C003", name: "佐藤物産" }
];

let cart = [];
let html5QrcodeScanner = null;
const FREE_SHIPPING_LINE = 32000;

window.addEventListener('DOMContentLoaded', () => {
    const datalist = document.getElementById('customerList');
    customerMaster.forEach(c => {
        const option = document.createElement('option');
        option.value = c.name;
        datalist.appendChild(option);
    });
});

function toggleNewCustomer(isChecked) {
    const input = document.getElementById('customerInput');
    const statusDiv = document.getElementById('customerStatus');
    if (isChecked) {
        input.value = "新規顧客（未登録）";
        input.disabled = true;
        statusDiv.innerText = "＋ このままスキャンへ。最後に住所を入力します。";
        statusDiv.style.color = "#dd6b20";
    } else {
        input.value = "";
        input.disabled = false;
        statusDiv.innerText = "";
    }
}

document.getElementById('customerInput').addEventListener('input', function(e) {
    const value = e.target.value;
    const statusDiv = document.getElementById('customerStatus');
    if(!value) { statusDiv.innerText = ''; return; }
    const match = customerMaster.find(c => c.name === value);
    if (match) {
        statusDiv.innerText = `✓ 登録済顧客 (ID: ${match.id})`;
        statusDiv.style.color = "#38a169";
    } else {
        statusDiv.innerText = "⚠ 未登録（新規情報として記録されます）";
        statusDiv.style.color = "#dd6b20";
    }
});

// iPhoneの最新iOSルールに最適化したカメラ起動処理
async function startScanner() {
    if (html5QrcodeScanner) { 
        try { await html5QrcodeScanner.stop(); } catch(e){} 
    }
    
    // 💡 iPhone側で確実に認識させるため、まずブラウザ経由でカメラの生権限を一度叩く
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        stream.getTracks().forEach(track => track.stop()); // 権限確認後、一旦すぐ閉じる
    } catch (err) {
        alert("iPhoneのカメラ権限が拒否されているか、他のアプリで占有されています: " + err);
        return;
    }

    // 💡 権限クリア後にリーダーを安全に初期化
    try {
        html5QrcodeScanner = new Html5Qrcode("reader");
        await html5QrcodeScanner.start(
            { facingMode: "environment" },
            { 
                fps: 10, 
                qrbox: (w, h) => { return { width: Math.floor(w * 0.85), height: 130 }; }
            },
            (decodedText) => { 
                if (navigator.vibrate) navigator.vibrate(100);
                handleScanSuccess(decodedText); 
            },
            (err) => {}
        );
    } catch(err) {
        alert("スキャナーの起動に失敗しました: " + err);
    }
}

async function handleScanSuccess(janCode) {
    if (html5QrcodeScanner) {
        try { await html5QrcodeScanner.stop(); } catch(e){}
    }

    const product = productMaster[janCode];
    if (!product) {
        alert("マスタ未登録のバーコードです\n数字: " + janCode);
        setTimeout(startScanner, 1500);
        return;
    }

    const existingItem = cart.find(item => item.jan === janCode);
    if (existingItem) {
        existingItem.qty += product.lot;
    } else {
        cart.push({
            jan: janCode,
            code: product.code,
            name: product.name,
            retailPrice: product.retailPrice,
            wholesalePrice: product.wholesalePrice,
            qty: product.lot
        });
    }
    updateCartUI();
    setTimeout(startScanner, 1200);
}

function updateCartUI() {
    const tbody = document.getElementById('cartTableBody');
    tbody.innerHTML = '';
    let total = 0;
    cart.forEach((item, index) => {
        const subtotal = item.wholesalePrice * item.qty;
        total += subtotal;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${item.name}</strong><br><span style="font-size:10px;color:#718096">${item.code}</span></td>
            <td>${item.wholesalePrice.toLocaleString()}円</td>
            <td><input type="number" class="qty-input" value="${item.qty}" min="1" onchange="updateQty(${index}, this.value)"></td>
            <td><strong>${subtotal.toLocaleString()}円</strong></td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById('totalAmount').innerText = total.toLocaleString();
    const meterDiv = document.getElementById('shippingMeter');
    if (total >= FREE_SHIPPING_LINE) {
        meterDiv.innerText = "★送料無料対象です！";
        meterDiv.className = "meter-text status-free";
    } else {
        const diff = FREE_SHIPPING_LINE - total;
        meterDiv.innerText = `あと ${diff.toLocaleString()} 円 で送料無料`;
        meterDiv.className = "meter-text status-need";
    }
}

function updateQty(index, newQty) {
    cart[index].qty = parseInt(newQty, 10) || 1;
    updateCartUI();
}

function generatePDF() {
    const customerName = document.getElementById('customerInput').value;
    const payment = document.getElementById('paymentMethod').value;
    const delivDate = document.getElementById('deliveryDate').value;
コードは注意してご使用ください。const address = document.getElementById('shippingAddress').value;const total = document.getElementById('totalAmount').innerText;if (!customerName) { alert("顧客名を選択、または新規にチェックを入れてください。"); return; }if (cart.length === 0) { alert("商品がスキャンされていません。"); return; }let detailsText = "";cart.forEach(item => {detailsText += ・[${item.code}] ${item.name} × ${item.qty} = ${(item.wholesalePrice * item.qty).toLocaleString()}円\n;});const summary = 【見積注文データ】\n宛先: ${customerName}\n決済: ${payment}\n納期: ${delivDate || '未指定'}\n住所: ${address || 'マスタ住所'}\n\n【明細】\n${detailsText}\n合計(下代): ${total} 円;alert(summary);}
